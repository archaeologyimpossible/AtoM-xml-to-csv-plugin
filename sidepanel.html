<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Archival XML Tabular Exporter</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; margin: 0; padding: 12px; color: #333; }
    h2 { font-size: 16px; margin: 0 0 10px 0; }
    .control-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
    label { font-weight: 600; font-size: 11px; text-transform: uppercase; color: #666; }
    select, input, button { padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    button { cursor: pointer; background: #0066cc; color: #fff; border: none; }
    button:hover { background: #0052a3; }
    .btn-secondary { background: #f0f0f0; color: #333; border: 1px solid #bbb; }
    .btn-secondary:hover { background: #e0e0e0; }
    .actions { display: flex; gap: 8px; margin: 12px 0; }
    #stats { font-weight: 600; margin: 8px 0; color: #2e7d32; }
    .table-container { overflow-x: auto; max-height: 480px; border: 1px solid #ddd; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border: 1px solid #e0e0e0; padding: 6px 8px; text-align: left; }
    th { background: #fafafa; position: sticky; top: 0; z-index: 1; }
    .column-tag { display: inline-block; background: #e3f2fd; padding: 2px 6px; border-radius: 3px; margin: 2px; }
  </style>
</head>
<body>
  <h2>Archive XML Tabular Exporter</h2>

  <div class="control-group">
    <label>View Preset</label>
    <select id="preset-select">
      <option value="inventory">Inventory List (Files & Items)</option>
      <option value="digital_objects">Digital Objects / DAOs</option>
      <option value="custom">Custom Configuration...</option>
    </select>
  </div>

  <div id="custom-controls" style="display: none;">
    <div class="control-group">
      <label>Row Selector (XPath)</label>
      <input type="text" id="row-xpath" value="//*[local-name()='c']" />
    </div>
  </div>

  <div class="actions">
    <button id="btn-parse">Load & Preview</button>
    <button id="btn-export" class="btn-secondary" disabled>Download CSV</button>
  </div>

  <div id="stats"></div>
  <div class="table-container">
    <table id="preview-table">
      <thead id="table-head"></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
